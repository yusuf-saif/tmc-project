name: tmc-app

environment:
  php: "8.4"

build:
  commands:
    - composer install --no-dev --optimize-autoloader --no-interaction
    - npm ci
    - npm run build

deploy:
  commands:
    - php artisan config:clear
    - php artisan route:clear
    - php artisan view:clear
    - php artisan migrate --force
    - php artisan tinker --execute="
        if (\Spatie\Permission\Models\Role::count() === 0) {
          Artisan::call('db:seed', ['--class' => 'RoleSeeder', '--force' => true]);
          Artisan::call('db:seed', ['--class' => 'AdminUserSeeder', '--force' => true]);
          Artisan::call('db:seed', ['--class' => 'InterestSeeder', '--force' => true]);
          Artisan::call('db:seed', ['--class' => 'GoalSeeder', '--force' => true]);
          Artisan::call('db:seed', ['--class' => 'EventSeeder', '--force' => true]);
          Artisan::call('db:seed', ['--class' => 'ResourceSeeder', '--force' => true]);
          Artisan::call('db:seed', ['--class' => 'SouqSeeder', '--force' => true]);
          Artisan::call('db:seed', ['--class' => 'CommunitySeeder', '--force' => true]);
          echo 'Seeded';
        } else {
          echo 'Already seeded, skipping';
        }
      "
    - php artisan optimize
    - php artisan storage:link

workers:
  - name: queue
    command: php artisan queue:work --queue=notifications,broadcasts,emails,default --tries=3 --timeout=60

scheduler: true
