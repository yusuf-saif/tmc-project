services:
  - type: web
    name: tmc-app
    runtime: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm ci
      npm run build
      php artisan config:clear
      php artisan route:clear
      php artisan view:clear
      php artisan optimize
      php artisan migrate --force
      php artisan db:seed --class=RoleSeeder --force
      php artisan db:seed --class=AdminUserSeeder --force
      php artisan db:seed --class=InterestSeeder --force
      php artisan db:seed --class=GoalSeeder --force
      php artisan db:seed --class=EventSeeder --force
      php artisan db:seed --class=ResourceSeeder --force
      php artisan db:seed --class=SouqSeeder --force
      php artisan db:seed --class=CommunitySeeder --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: "The Muhsinat Club"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: tmc-app
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: tmc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tmc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: tmc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tmc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tmc-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: MAIL_MAILER
        value: log

databases:
  - name: tmc-db
    plan: free
    databaseName: tmc_production
    user: tmc_user
