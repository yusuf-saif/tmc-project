services:
  - type: web
    name: tmc-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: The Muhsinat Club
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://tmc-app.onrender.com
      - key: ASSET_URL
        value: https://tmc-app.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: tmc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tmc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: tmc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tmc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tmc-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: noreply@themuhsinatclub.com
      - key: MAIL_FROM_NAME
        value: The Muhsinat Club
      - key: BROADCAST_CONNECTION
        value: log
      - key: VAPID_SUBJECT
        value: mailto:noreply@themuhsinatclub.com
      - key: VAPID_PUBLIC_KEY
        value: ""
      - key: VAPID_PRIVATE_KEY
        value: ""

databases:
  - name: tmc-db
    plan: free
    databaseName: tmc_production
    user: tmc_user
