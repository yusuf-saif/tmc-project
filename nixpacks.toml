# nixpacks.toml for Railway
[phases.setup]
# Use PHP 8.4 and Node 22
php = "8.4"
nodejs = "22"

[phases.install]
# Composer install (without dev)
install_commands = [
    "composer install --no-dev --optimize-autoloader --no-scripts"
]

[phases.build]
build_commands = [
    "php artisan optimize"
]

[phases.start]
start_command = "php artisan serve --host=0.0.0.0 --port=$PORT"