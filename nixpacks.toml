[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_pgsql",
           "php84Extensions.pgsql", "php84Extensions.mbstring",
           "php84Extensions.zip", "php84Extensions.gd",
           "php84Extensions.bcmath", "php84Extensions.opcache",
           "php84Extensions.intl", "php84Extensions.xml",
           "php84Extensions.tokenizer", "php84Extensions.ctype",
           "php84Extensions.curl", "nodejs_22", "nodePackages.npm"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
  "npm run build",
  "rm -rf node_modules"
]

[phases.build]
cmds = [
  "php artisan config:clear",
  "php artisan route:clear",
  "php artisan view:clear"
]

[start]
cmd = "php artisan migrate --force && php artisan tinker --execute=\"if(\\\\Spatie\\\\Permission\\\\Models\\\\Role::count()===0){\\\\Artisan::call('db:seed',['--class'=>'RoleSeeder','--force'=>true]);\\\\Artisan::call('db:seed',['--class'=>'AdminUserSeeder','--force'=>true]);\\\\Artisan::call('db:seed',['--class'=>'InterestSeeder','--force'=>true]);\\\\Artisan::call('db:seed',['--class'=>'GoalSeeder','--force'=>true]);\\\\Artisan::call('db:seed',['--class'=>'EventSeeder','--force'=>true]);\\\\Artisan::call('db:seed',['--class'=>'ResourceSeeder','--force'=>true]);\\\\Artisan::call('db:seed',['--class'=>'SouqSeeder','--force'=>true]);\\\\Artisan::call('db:seed',['--class'=>'CommunitySeeder','--force'=>true]);}\" && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"
