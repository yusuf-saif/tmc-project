[phases.setup]
nixPkgs = [
  "php84",
  "php84Extensions.pdo",
  "php84Extensions.pdo_pgsql",
  "php84Extensions.pgsql",
  "php84Extensions.mbstring",
  "php84Extensions.zip",
  "php84Extensions.gd",
  "php84Extensions.bcmath",
  "php84Extensions.opcache",
  "php84Extensions.intl",
  "php84Extensions.xml",
  "php84Extensions.tokenizer",
  "php84Extensions.ctype",
  "php84Extensions.curl",
  "php84Extensions.sodium",
  "nodejs_22",
  "nodePackages.npm",
  "php84Packages.composer"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
  "npm run build",
  "rm -rf node_modules"
]

[start]
cmd = "php artisan migrate --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
