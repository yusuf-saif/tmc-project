# nixpacks.toml for Laravel + Octane on Railway
[phases.setup]
php = "8.4"
nodejs = "22"

[phases.install]
install_commands = [
    "composer install --no-dev --optimize-autoloader --no-scripts"
]

[phases.build]
build_commands = [
    "php artisan optimize"
]

[phases.start]
start_command = "php artisan octane:start --server=swoole --host=0.0.0.0 --port=$PORT"