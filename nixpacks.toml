# nixpacks.toml for Laravel 11 production on Railway
[phases.setup]
php = "8.4"
nodejs = "22"

[phases.install]
install_commands = [
    "composer install --no-dev --optimize-autoloader --no-scripts"
]

[phases.build]
build_commands = [
    "php artisan optimize"
]

[phases.start]
# PHP-FPM will serve, Railway routes HTTP traffic to container port
start_command = "php-fpm"