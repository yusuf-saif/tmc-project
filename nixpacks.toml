# nixpacks.toml
[phases.setup]
runtime = "php"
extensions = [
    "pdo",
    "pdo_pgsql",
    "mbstring",
    "zip",
    "gd",
    "bcmath",
    "opcache",
    "intl",
    "xml",
    "tokenizer",
    "ctype",
    "curl"
]
packages = ["php84Packages.composer"]  # Ensures composer is installed

[phases.install]
commands = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build"
]

[phases.build]
commands = ["npm run build"]

[phases.start]
command = "php artisan migrate --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"